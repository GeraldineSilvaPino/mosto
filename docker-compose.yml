services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mosto_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Montar código local para hot-reload en desarrollo
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload


