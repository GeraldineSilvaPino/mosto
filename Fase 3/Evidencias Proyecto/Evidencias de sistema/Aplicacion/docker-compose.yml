name: mosto-operacion

x-api: &api
  build: ./backend
  env_file:
    - ${MOSTO_CONFIG_FILE:-./.env.operacion}
  environment:
    MOSTO_ENV: production
    PGSSLROOTCERT: /run/mosto/ca.crt
  volumes:
    - type: bind
      source: ${MOSTO_CA_FILE:-./supabase-ca.crt}
      target: /run/mosto/ca.crt
      read_only: true
      bind:
        create_host_path: false
  restart: unless-stopped

services:
  simulator:
    build: ./backend
    command: python -u -m scripts.simulate_v2 --manifest /fleet/fleet.json --env-file /fleet/device-keys.env --state /state/emitter.sqlite --batch 1
    restart: on-failure:5
    volumes:
      - type: bind
        source: ./backend/artifacts/flota-operacion
        target: /fleet
        read_only: true
        bind:
          create_host_path: false
      - simulator_state:/state
    depends_on:
      backend:
        condition: service_healthy
  backend:
    <<: *api
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
  watchdog:
    <<: *api
    command: python -u -m scripts.watchdog --interval-seconds 60
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "${MOSTO_BIND_ADDRESS:-127.0.0.1}:${MOSTO_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  simulator_state:
