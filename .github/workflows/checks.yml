name: Mosto checks
on:
  pull_request:
  push:
    branches: [develop, 'codex/**', 'feat/**']
defaults:
  run:
    working-directory: "Fase 2/Evidencias Proyecto/Evidencias de sistema/Aplicacion"
permissions:
  contents: read
jobs:
  isolated-tests-and-build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install audited Windows environment
        run: python -m pip install -r backend/requirements-tested-windows-py314.txt
      - name: Isolated backend tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: "Fase 2/Evidencias Proyecto/Evidencias de sistema/Aplicacion/frontend/package-lock.json"
      - name: Install frontend
        working-directory: "Fase 2/Evidencias Proyecto/Evidencias de sistema/Aplicacion/frontend"
        run: npm ci
      - name: Build frontend
        working-directory: "Fase 2/Evidencias Proyecto/Evidencias de sistema/Aplicacion/frontend"
        run: npm run build

  postgresql-migrations-and-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MOSTO_TEST_DATABASE_URL: postgresql+psycopg2://mosto_test:local-test-only@127.0.0.1:55433/mosto_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-test.txt
      - name: Create unprivileged test owner in disposable service
        env:
          PGPASSWORD: local-ci-only
        run: psql -h 127.0.0.1 -p 55433 -U postgres -d postgres -v ON_ERROR_STOP=1 -f backend/tests/postgres-init.sql
      - name: Test migrations, scope and concurrency on PostgreSQL
        run: python -m pytest -q -p no:cacheprovider
